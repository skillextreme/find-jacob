<!doctype html>
<html lang="en" class="is-searching">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF3E0" />
    <meta name="robots" content="noindex" />
    <title>Find Jacob in the Park</title>
    <meta name="description" content="I found us a spot. Can you find me?" />
    <meta property="og:title" content="Find Jacob in the Park" />
    <meta property="og:description" content="I found us a spot. Can you find me?" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://find-jacob.netlify.app/" />
    <meta property="og:image" content="https://find-jacob.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FFE08A'/%3E%3Ccircle cx='16' cy='17' r='8' fill='%23F26B5B'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Shared SVG patterns used by the park and the portrait. -->
    <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <pattern id="checks" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#f6f6f2" />
          <rect width="5" height="10" fill="#8f999e" opacity=".55" />
          <rect width="10" height="5" fill="#8f999e" opacity=".55" />
        </pattern>
        <pattern id="gingham" width="28" height="28" patternUnits="userSpaceOnUse">
          <rect width="28" height="28" fill="#fff8e3" />
          <rect width="14" height="28" fill="#f7ce5b" opacity=".6" />
          <rect width="28" height="14" fill="#f7ce5b" opacity=".6" />
        </pattern>
      </defs>
    </svg>

    <main id="app" data-state="loading">
      <section id="stage" class="stage">
        <div
          id="finder"
          class="finder"
          tabindex="0"
          role="application"
          aria-label="Hidden park. Use the arrow keys to move the window and look for Jacob. Press Enter when you find him."
          aria-describedby="instruction"
        ></div>

        <header id="intro" class="intro">
          <div id="portrait" class="intro__portrait" role="img" aria-label="Jacob: dark messy hair, coral t-shirt"></div>
          <div class="intro__text">
            <h1>I found us a spot. Can you find me?</h1>
            <p id="instruction" class="intro__instruction">Move around to find me</p>
            <p id="loading" class="intro__loading" role="status">
              <span class="spinner" aria-hidden="true"></span> Loading the park…
            </p>
          </div>
        </header>

        <button id="jacob-bubble" class="bubble" type="button" hidden>Found me?</button>
        <button id="skip" class="skip" type="button" hidden>Reveal invitation</button>
        <button id="replay" class="chip chip--replay" type="button" hidden>Play again</button>
        <p id="count-badge" class="chip chip--count" hidden></p>
      </section>

      <section id="invite" class="invite" aria-labelledby="invite-title" hidden></section>

      <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </main>

    <noscript>
      <div class="noscript">
        <h1>%EVENT_TITLE%</h1>
        <p>%EVENT_DATE%, %EVENT_TIME% (%EVENT_TZ%)</p>
        <p>%EVENT_VENUE%. %EVENT_MEETING%</p>
        <p>%EVENT_PLAN% %EVENT_BRING%</p>
        <p>Turn on JavaScript to play the game and RSVP, or message Jacob on WhatsApp.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
